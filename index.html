<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's in my bag?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column, three steps. Each step shows one thing: the shelf of items, one sentence to say, the bag. */
:root {
  --bg: #f4f3ef;
  --panel: #ffffff;
  --fg: #1f2328;
  --muted: #6b7280;
  --line: #e4e2db;
  --accent: #2458e6;
  --accent-ink: #ffffff;
  --soft: #e9effd;
  --ok: #1f9d55;
  --bad: #d64545;
  --font-en: "Nunito", "Noto Sans KR", system-ui, sans-serif;
  --font-ko: "Noto Sans KR", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17191d; --panel: #22252b; --fg: #eceef2; --muted: #9aa1ad; --line: #343840;
    --accent: #5b8aff; --accent-ink: #0f1420; --soft: #243253; --ok: #3cc374; --bad: #ff6b6b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17191d; --panel: #22252b; --fg: #eceef2; --muted: #9aa1ad; --line: #343840;
  --accent: #5b8aff; --accent-ink: #0f1420; --soft: #243253; --ok: #3cc374; --bad: #ff6b6b; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ko); font-size: 17px; line-height: 1.5; -webkit-tap-highlight-color: transparent; user-select: none; }
button { font: inherit; color: inherit; }
.wrap { max-width: 780px; margin: 0 auto; padding-block: 18px 150px; padding-inline: 16px; }

/* Header + steps */
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
h1 { font-family: var(--font-en); font-weight: 800; font-size: 1.5rem; margin: 0; letter-spacing: -.01em; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.step { border: 0; background: transparent; border-radius: 10px; padding: 10px 6px; cursor: pointer; color: var(--muted); font-weight: 700; font-size: .95rem; display: flex; align-items: center; justify-content: center; gap: 6px; }
.step .n { font-family: var(--font-en); font-size: .8rem; opacity: .7; }
.step[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.step[aria-selected="true"] .n { opacity: 1; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--soft); outline-offset: 2px; }
.panel { margin-top: 18px; }
.lead { color: var(--muted); font-size: .95rem; margin: 0 0 14px; }

/* Step 1: shelf */
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 6px; margin-bottom: 16px; }
.dialog .l { display: grid; grid-template-columns: 2.2em 1fr auto; align-items: center; gap: 10px; font-family: var(--font-en); font-weight: 700; font-size: 1.2rem; }
.dialog .who { font-family: var(--font-ko); font-size: .8rem; color: var(--muted); font-weight: 700; }
.dialog .l em { font-style: normal; color: var(--accent); }
.play { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: inline-grid; place-items: center; flex: none; }
.play svg { width: 16px; height: 16px; fill: var(--fg); }
.play:active { transform: scale(.94); }

.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.item { position: relative; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 14px 10px 12px; display: grid; justify-items: center; gap: 2px; cursor: grab; text-align: center; touch-action: none; }
.item .pic { width: 84px; height: 84px; }
.item .pic svg { width: 100%; height: 100%; display: block; }
.item .en { font-family: var(--font-en); font-weight: 800; font-size: 1.1rem; margin-top: 4px; }
.item .ko { color: var(--muted); font-size: .85rem; }
.item.active { border-color: var(--accent); }
.item.inbag { border-color: var(--ok); }
.item .add { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--soft); color: var(--accent); font-family: var(--font-en); font-weight: 800; font-size: 1.1rem; cursor: pointer; display: grid; place-items: center; line-height: 1; }
.item.inbag .add { background: var(--ok); color: #fff; }
.drag-ghost { position: fixed; z-index: 50; pointer-events: none; width: 84px; height: 84px; transform: translate(-50%, -50%) scale(1.1); filter: drop-shadow(0 8px 10px rgba(0,0,0,.25)); }
.drag-ghost svg { width: 100%; height: 100%; }

/* Bag dock (drop target), shown on steps 1 and 2 */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 1px solid var(--line); transition: background .15s; }
.dock .in { max-width: 780px; margin: 0 auto; display: flex; align-items: center; gap: 14px; cursor: pointer; }
.dock .bagico { width: 64px; height: 64px; flex: none; }
.dock .bagico svg { width: 100%; height: 100%; display: block; }
.dock .items { display: flex; gap: 6px; flex: 1; min-width: 0; overflow: hidden; }
.dock .items span { width: 40px; height: 40px; flex: none; }
.dock .items svg { width: 100%; height: 100%; }
.dock .items .more { display: grid; place-items: center; font-family: var(--font-en); font-weight: 800; color: var(--muted); font-size: .9rem; }
.dock .txt { text-align: right; flex: none; }
.dock .txt b { display: block; font-family: var(--font-en); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.dock .txt small { color: var(--muted); font-size: .8rem; }
.dock.over { background: var(--soft); }
.dock.pop .bagico { animation: pop .3s; }
@keyframes pop { 40% { transform: scale(1.12) rotate(-4deg); } }

/* Step 2: one sentence at a time */
.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 16px; padding: 36px 16px; text-align: center; display: grid; gap: 12px; justify-items: center; color: var(--muted); }
.empty .bagico { width: 96px; height: 96px; }
.progress { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
.progress i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.progress i.on { background: var(--accent); }
.progress i.done { background: var(--ok); }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 24px 20px; display: grid; justify-items: center; gap: 14px; text-align: center; }
.stage .pic { width: 150px; height: 150px; }
.stage .pic svg { width: 100%; height: 100%; }
.tag { font-size: .8rem; font-weight: 700; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 4px 12px; }
.tag.ok { color: var(--ok); } .tag.no { color: var(--bad); }
.stage .who { font-size: .85rem; color: var(--muted); font-weight: 700; }
.sentence { font-family: var(--font-en); font-weight: 800; font-size: clamp(1.5rem, 5vw, 2.1rem); line-height: 1.3; text-wrap: balance; max-width: 22ch; }
.sentence .w { display: inline-block; border-radius: 6px; padding: 0 .08em; }
.sentence .w.hit { color: var(--ok); }
.sentence .w.miss { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }
.controls { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
.round { border: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.round svg { fill: currentColor; }
.listen { width: 64px; height: 64px; background: var(--soft); color: var(--accent); }
.listen svg { width: 26px; height: 26px; }
.mic { width: 84px; height: 84px; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 20px rgba(36, 88, 230, .3); }
.mic svg { width: 36px; height: 36px; }
.mic.on { background: var(--bad); box-shadow: 0 0 0 0 rgba(214,69,69,.4); animation: pulse 1.1s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 18px rgba(214,69,69,0); } 100% { box-shadow: 0 0 0 0 rgba(214,69,69,0); } }
.mic:disabled { opacity: .35; box-shadow: none; cursor: default; }
.lbl { font-size: .8rem; color: var(--muted); font-weight: 700; }
.result { width: 100%; max-width: 420px; display: grid; gap: 8px; min-height: 64px; }
.pct { font-family: var(--font-en); font-weight: 800; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.pct.good { color: var(--ok); } .pct.mid { color: #c48a00; } .pct.low { color: var(--bad); }
.meter { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--bad); border-radius: 999px; transition: width .4s; }
.meter i.mid { background: #e6a800; } .meter i.good { background: var(--ok); }
.heard { font-size: .9rem; color: var(--muted); }
.heard b { color: var(--fg); font-weight: 500; }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }
.btn { font-weight: 700; font-size: 1rem; border: 1px solid var(--line); border-radius: 12px; padding: 12px 20px; cursor: pointer; background: var(--panel); color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.yes { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.no { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.big { font-family: var(--font-en); font-size: 1.2rem; padding: 14px 24px; flex: 1; }
.warn { background: var(--soft); border-radius: 12px; padding: 10px 14px; font-size: .9rem; margin-bottom: 14px; }

/* Step 3: the bag */
.bagview { display: grid; justify-items: center; gap: 16px; }
.backpack { position: relative; width: min(100%, 360px); }
.backpack > svg { width: 100%; height: auto; display: block; }
.inside { position: absolute; left: 18%; right: 18%; top: 18%; height: 29%; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-end; gap: 2px; padding: 4px; overflow: hidden; }
.inside button { width: 30%; aspect-ratio: 1; border: 0; background: transparent; padding: 0; cursor: pointer; animation: drop .4s; }
.inside button svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
.inside button:hover { transform: translateY(-3px); }
@keyframes drop { from { transform: translateY(-30px); opacity: 0; } }
.inside .none { align-self: center; color: rgba(255,255,255,.6); font-size: .9rem; }
.have { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; width: 100%; display: flex; align-items: center; gap: 12px; }
.have .s { font-family: var(--font-en); font-weight: 700; font-size: 1.15rem; flex: 1; min-width: 0; }
.have .s small { display: block; font-family: var(--font-ko); font-weight: 400; color: var(--muted); font-size: .85rem; }
.ask { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; width: 100%; display: grid; gap: 14px; }
.ask .q { display: flex; align-items: center; gap: 12px; }
.ask .q .face { width: 48px; height: 48px; flex: none; }
.ask .q .face svg { width: 100%; height: 100%; }
.ask .q .t { font-family: var(--font-en); font-weight: 800; font-size: 1.4rem; flex: 1; min-width: 0; }
.ask .row { display: flex; gap: 10px; }
.ask .fb { min-height: 1.5em; font-family: var(--font-en); font-weight: 700; font-size: 1.05rem; }
.ask .fb.ok { color: var(--ok); } .ask .fb.bad { color: var(--bad); }
.rowc { display: flex; gap: 10px; justify-content: center; }

@media (prefers-reduced-motion: reduce) { .dock.pop .bagico, .inside button, .mic.on { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>What's in my bag?</h1>
  </header>
  <div class="steps" role="tablist">
    <button class="step" role="tab" id="t-learn" aria-selected="true" aria-controls="learn"><span class="n">1</span>단어</button>
    <button class="step" role="tab" id="t-say" aria-selected="false" aria-controls="say"><span class="n">2</span>말하기</button>
    <button class="step" role="tab" id="t-bag" aria-selected="false" aria-controls="bag"><span class="n">3</span>내 가방</button>
  </div>

  <!-- 1. 단어 -->
  <section class="panel" id="learn" role="tabpanel">
    <p class="lead">물건을 누르면 소리가 나요. 아래 가방으로 끌어다 놓거나 + 를 누르면 가방에 들어가요.</p>
    <div class="dialog" id="dialog">
      <div class="l"><span class="who">친구</span><span id="d-q">Do you have <em>a pen</em>?</span><button class="play" data-k="q" aria-label="듣기"></button></div>
      <div class="l"><span class="who">나</span><span id="d-a">Yes, I do. I have <em>a pen</em>.</span><button class="play" data-k="yes" aria-label="듣기"></button></div>
    </div>
    <div class="shelf" id="shelf"></div>
  </section>

  <!-- 2. 말하기 -->
  <section class="panel" id="say" role="tabpanel" hidden>
    <div class="warn" id="sr-warn" hidden>이 브라우저는 음성 인식을 지원하지 않아요. Chrome 이나 Edge 에서 열면 따라 말하기를 할 수 있어요.</div>
    <div class="empty" id="say-empty">
      <div class="bagico" id="empty-bag"></div>
      <div>가방이 비어 있어요.<br>1번에서 물건을 가방에 넣으면 그 물건으로 말하기 연습을 해요.</div>
      <button class="btn primary" id="say-go">1번으로 가기</button>
    </div>
    <div id="say-body" hidden>
      <div class="progress" id="progress"></div>
      <div class="stage">
        <div class="pic" id="s-pic"></div>
        <span class="tag" id="s-tag"></span>
        <div class="who" id="s-who"></div>
        <div class="sentence" id="s-text"></div>
        <div class="controls">
          <div style="display:grid;justify-items:center;gap:6px"><button class="round listen" id="s-listen" aria-label="듣기"></button><span class="lbl">듣기</span></div>
          <div style="display:grid;justify-items:center;gap:6px"><button class="round mic" id="s-mic" aria-label="따라 말하기"></button><span class="lbl" id="mic-lbl">따라 말하기</span></div>
        </div>
        <div class="result" id="s-result"></div>
      </div>
      <div class="nav">
        <button class="btn" id="s-prev">← 이전</button>
        <button class="btn primary" id="s-next">다음 →</button>
      </div>
    </div>
  </section>

  <!-- 3. 내 가방 -->
  <section class="panel" id="bag" role="tabpanel" hidden>
    <div class="bagview">
      <div class="backpack" id="backpack"></div>
      <div class="have">
        <span class="s" id="have-s"></span>
        <button class="play" id="have-play" aria-label="듣기"></button>
      </div>
      <div class="ask">
        <div class="q"><span class="face" id="face"></span><span class="t" id="ask-t"></span><button class="play" id="ask-play" aria-label="듣기"></button></div>
        <div class="row"><button class="btn big yes" id="ans-yes">Yes, I do.</button><button class="btn big no" id="ans-no">No, I don't.</button></div>
        <div class="fb" id="ask-fb"></div>
        <div class="rowc"><button class="btn" id="ask-next">다른 질문</button><button class="btn" id="bag-reset">가방 비우기</button></div>
      </div>
    </div>
  </section>
</div>

<div class="dock" id="dock" role="button" tabindex="0" aria-label="내 가방 열기">
  <div class="in">
    <div class="bagico" id="dock-bag"></div>
    <div class="items" id="dock-items"></div>
    <div class="txt"><b id="dock-n">0</b><small>내 가방</small></div>
  </div>
</div>

<script>
// ---------- 그림 (모두 같은 스타일의 SVG) ----------
const V = (body) => `<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
const PIC = {
  pen: V(`<g transform="rotate(45 40 40)"><rect x="33" y="8" width="14" height="48" rx="4" fill="#2458e6"/><rect x="33" y="8" width="14" height="10" rx="4" fill="#163a9c"/><rect x="45" y="12" width="3" height="18" rx="1.5" fill="#c9d3f5"/><path d="M33 56h14l-5 10h-4z" fill="#d9dde6"/><path d="M38 66h4l-2 6z" fill="#1f2328"/></g>`),
  pencil: V(`<g transform="rotate(45 40 40)"><rect x="33" y="6" width="14" height="52" fill="#f6c343"/><rect x="33" y="6" width="5" height="52" fill="#e0a92a"/><rect x="33" y="6" width="14" height="8" fill="#f28b9b"/><rect x="33" y="14" width="14" height="4" fill="#b9bfc9"/><path d="M33 58h14l-7 14z" fill="#f0d9b5"/><path d="M37.5 67h5l-2.5 5z" fill="#1f2328"/></g>`),
  glue: V(`<rect x="28" y="24" width="24" height="46" rx="6" fill="#f6c343"/><rect x="28" y="24" width="24" height="8" rx="4" fill="#e0a92a"/><rect x="30" y="10" width="20" height="14" rx="4" fill="#e0a92a"/><rect x="32" y="38" width="16" height="22" rx="3" fill="#fff8e1"/><text x="40" y="52" font-size="7" font-weight="700" text-anchor="middle" font-family="sans-serif" fill="#b57b00">GLUE</text>`),
  ruler: V(`<g transform="rotate(-35 40 40)"><rect x="6" y="31" width="68" height="18" rx="3" fill="#f3d9a4"/><rect x="6" y="31" width="68" height="18" rx="3" fill="none" stroke="#d6b36b" stroke-width="2"/>${[...Array(13)].map((_, i) => `<rect x="${11 + i * 5}" y="31" width="1.5" height="${i % 2 ? 4 : 7}" fill="#8a6a2f"/>`).join("")}</g>`),
  eraser: V(`<g transform="rotate(-20 40 40)"><rect x="14" y="27" width="52" height="26" rx="5" fill="#f28b9b"/><rect x="14" y="27" width="22" height="26" rx="5" fill="#5b8aff"/><rect x="31" y="27" width="5" height="26" fill="#2458e6"/><rect x="14" y="46" width="52" height="7" rx="3" fill="rgba(0,0,0,.12)"/></g>`),
  notebook: V(`<rect x="18" y="12" width="46" height="58" rx="5" fill="#2458e6"/><rect x="26" y="26" width="30" height="20" rx="3" fill="#fff"/><rect x="30" y="32" width="22" height="2.5" fill="#c9d3f5"/><rect x="30" y="38" width="16" height="2.5" fill="#c9d3f5"/>${[...Array(6)].map((_, i) => `<circle cx="18" cy="${18 + i * 9.5}" r="3" fill="#f4f3ef" stroke="#9aa1ad" stroke-width="2"/>`).join("")}`),
  crayon: V(`<g transform="rotate(45 40 40)"><rect x="33" y="14" width="14" height="46" rx="2" fill="#e5484d"/><rect x="33" y="22" width="14" height="26" fill="#f4f3ef"/><rect x="33" y="24" width="14" height="22" fill="#e5484d" opacity=".15"/><path d="M33 14h14l-7-10z" fill="#e5484d"/><rect x="33" y="60" width="14" height="4" fill="#b73238"/></g>`),
  scissors: V(`<g transform="rotate(-30 40 40)"><path d="M32 42 L44 8 l6 2 -14 36z" fill="#b9bfc9"/><path d="M48 42 L36 8 l-6 2 14 36z" fill="#d9dde6"/><circle cx="40" cy="40" r="3.5" fill="#1f2328"/><ellipse cx="30" cy="58" rx="9" ry="13" transform="rotate(25 30 58)" fill="none" stroke="#e5484d" stroke-width="6"/><ellipse cx="50" cy="58" rx="9" ry="13" transform="rotate(-25 50 58)" fill="none" stroke="#e5484d" stroke-width="6"/></g>`),
  book: V(`<rect x="16" y="12" width="50" height="58" rx="3" fill="#1f9d55"/><rect x="22" y="12" width="44" height="58" rx="3" fill="#27b665"/><rect x="16" y="12" width="8" height="58" fill="#15723d"/><rect x="34" y="24" width="24" height="16" rx="2" fill="#fff"/><rect x="38" y="30" width="16" height="2.5" fill="#9aa1ad"/>`),
  bottle: V(`<rect x="30" y="6" width="20" height="12" rx="3" fill="#1f6fb2"/><rect x="26" y="18" width="28" height="56" rx="9" fill="#7fc4ff"/><rect x="26" y="34" width="28" height="22" fill="#fff"/><path d="M34 45l6-7 6 7-6 7z" fill="#2458e6"/><rect x="30" y="24" width="4" height="40" rx="2" fill="rgba(255,255,255,.5)"/>`),
  pcase: V(`<rect x="8" y="26" width="64" height="32" rx="12" fill="#7c5cff"/><rect x="8" y="26" width="64" height="9" rx="4.5" fill="#5b3fd6"/><circle cx="62" cy="30.5" r="3" fill="#f6c343"/><rect x="16" y="40" width="48" height="12" rx="4" fill="#9d86ff"/>`),
  keyring: V(`<circle cx="26" cy="22" r="12" fill="none" stroke="#9aa1ad" stroke-width="5"/><circle cx="46" cy="50" r="18" fill="#c48a52"/><circle cx="33" cy="38" r="6" fill="#c48a52"/><circle cx="59" cy="38" r="6" fill="#c48a52"/><ellipse cx="46" cy="55" rx="8" ry="6" fill="#f0d9b5"/><circle cx="40" cy="47" r="2" fill="#1f2328"/><circle cx="52" cy="47" r="2" fill="#1f2328"/><circle cx="46" cy="53" r="2" fill="#1f2328"/>`),
  keycap: V(`<rect x="12" y="16" width="56" height="52" rx="10" fill="#2b2f38"/><rect x="16" y="12" width="48" height="44" rx="9" fill="#f6c343"/><rect x="20" y="16" width="40" height="36" rx="7" fill="#ffd45e"/><text x="40" y="42" font-size="22" font-weight="800" text-anchor="middle" font-family="sans-serif" fill="#2b2f38">A</text>`),
  slime: V(`<rect x="12" y="30" width="56" height="40" rx="8" fill="#e8f3ff" stroke="#b6d2f2" stroke-width="2"/><path d="M14 44c6-10 14-10 20-4s14 4 18-4 10-2 14 6v18a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8z" fill="#63d26f"/><ellipse cx="30" cy="52" rx="6" ry="3" fill="#b9f0bf"/><rect x="10" y="22" width="60" height="10" rx="4" fill="#7fc4ff"/>`),
  sticker: V(`<path d="M40 8l9 18 20 3-14 14 3 20-18-9-18 9 3-20L11 29l20-3z" fill="#f6c343" stroke="#e0a92a" stroke-width="2"/><path d="M40 20l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z" fill="#ffd45e"/>`),
};
const BAG_SVG = `<svg viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg">
  <path d="M95 48c0-26 18-40 55-40s55 14 55 40v10h-18v-8c0-16-12-24-37-24s-37 8-37 24v8H95z" fill="#1f3f8f"/>
  <rect x="60" y="60" width="38" height="250" rx="18" fill="#1f3f8f"/><rect x="202" y="60" width="38" height="250" rx="18" fill="#1f3f8f"/>
  <rect x="36" y="56" width="228" height="268" rx="46" fill="#2458e6"/>
  <path d="M36 102h228v176a46 46 0 0 1-46 46H82a46 46 0 0 1-46-46z" fill="#2458e6"/>
  <rect x="52" y="60" width="196" height="100" rx="34" fill="#163a9c"/>
  <rect x="52" y="122" width="196" height="6" fill="#0e2a73"/>
  <path d="M36 150h228v128a46 46 0 0 1-46 46H82a46 46 0 0 1-46-46z" fill="#2458e6"/>
  <path d="M36 150h228v12H36z" fill="#1a49c2"/>
  <rect x="70" y="196" width="160" height="100" rx="24" fill="#1a49c2"/>
  <rect x="70" y="196" width="160" height="12" rx="6" fill="#0e2a73"/>
  <rect x="134" y="200" width="32" height="6" rx="3" fill="#c9d3f5"/>
  <rect x="122" y="170" width="56" height="12" rx="6" fill="#0e2a73"/>
  <rect x="44" y="230" width="16" height="60" rx="8" fill="#163a9c"/><rect x="240" y="230" width="16" height="60" rx="8" fill="#163a9c"/>
</svg>`;
const BAG_ICON = `<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><path d="M28 18c0-8 5-12 12-12s12 4 12 12v4h-6v-3c0-4-2-7-6-7s-6 3-6 7v3h-6z" fill="#1f3f8f"/><rect x="12" y="20" width="56" height="54" rx="14" fill="#2458e6"/><rect x="16" y="22" width="48" height="22" rx="10" fill="#163a9c"/><rect x="22" y="48" width="36" height="18" rx="7" fill="#1a49c2"/><rect x="32" y="50" width="16" height="3" rx="1.5" fill="#c9d3f5"/></svg>`;
const FACE = `<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><circle cx="40" cy="42" r="30" fill="#f6d2b4"/><path d="M12 36c0-18 12-28 28-28s28 10 28 28c-6-6-12-8-28-8s-22 2-28 8z" fill="#3b2a20"/><circle cx="30" cy="44" r="3" fill="#1f2328"/><circle cx="50" cy="44" r="3" fill="#1f2328"/><path d="M32 56q8 6 16 0" stroke="#1f2328" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
const ICON = {
  play: `<svg viewBox="0 0 24 24"><path d="M5 3l15 9-15 9z"/></svg>`,
  speaker: `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zm11 3a4 4 0 0 0-2-3.5v7A4 4 0 0 0 14 12zm-2-8.8v2.1A7 7 0 0 1 19 12a7 7 0 0 1-7 6.7v2.1A9 9 0 0 0 21 12a9 9 0 0 0-9-8.8z"/></svg>`,
  mic: `<svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4h-2a4 4 0 0 1-8 0H6a6 6 0 0 0 5 5.9V20H8v2h8v-2h-3v-3.1A6 6 0 0 0 18 11z"/></svg>`,
};

// ---------- 단어 ----------
const WORDS = [
  { id: "pen",      en: "pen",          ko: "펜",     art: "a",  tb: true },
  { id: "glue",     en: "glue stick",   ko: "딱풀",   art: "a",  tb: true },
  { id: "ruler",    en: "ruler",        ko: "자",     art: "a",  tb: true },
  { id: "eraser",   en: "eraser",       ko: "지우개", art: "an", tb: true },
  { id: "notebook", en: "notebook",     ko: "공책",   art: "a",  tb: true },
  { id: "crayon",   en: "crayon",       ko: "크레용", art: "a",  tb: true },
  { id: "pencil",   en: "pencil",       ko: "연필",   art: "a" },
  { id: "pcase",    en: "pencil case",  ko: "필통",   art: "a" },
  { id: "scissors", en: "scissors",     ko: "가위",   art: "" },
  { id: "book",     en: "book",         ko: "책",     art: "a" },
  { id: "bottle",   en: "water bottle", ko: "물병",   art: "a" },
  { id: "sticker",  en: "sticker",      ko: "스티커", art: "a" },
  { id: "keyring",  en: "keyring",      ko: "키링",   art: "a" },
  { id: "keycap",   en: "keycap",       ko: "키캡",   art: "a" },
  { id: "slime",    en: "slime",        ko: "슬라임", art: "" },
];
const byId = Object.fromEntries(WORDS.map(w => [w.id, w]));
const withArt = w => (w.art ? w.art + " " : "") + w.en;
const S = {
  q:   w => `Do you have ${withArt(w)}?`,
  yes: w => `Yes, I do. I have ${withArt(w)}.`,
  no:  w => `No, I don't. I don't have ${withArt(w)}.`,
};
const $ = id => document.getElementById(id);

// ---------- 말하기 (TTS) ----------
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /en-US/i.test(v.lang) && /Samantha|Google US|Aria|Jenny|Zira/i.test(v.name)) || vs.find(v => /en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate = 0.85) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate; if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

// ---------- 가방 (세 단계가 함께 쓰는 상태) ----------
const bag = [];
const inBag = id => bag.includes(id);
const watchers = [];
const onBag = fn => watchers.push(fn);
function changed() { watchers.forEach(fn => fn()); try { localStorage.setItem("bag-items", JSON.stringify(bag)); } catch (e) {} }
function putIn(id) { if (inBag(id)) return false; bag.push(id); changed(); return true; }
function takeOut(id) { const i = bag.indexOf(id); if (i >= 0) { bag.splice(i, 1); changed(); } }
try { JSON.parse(localStorage.getItem("bag-items") || "[]").forEach(id => byId[id] && bag.push(id)); } catch (e) {}

// ---------- 단계 전환 ----------
const steps = [...document.querySelectorAll(".step")];
function show(id) {
  steps.forEach(s => { const on = s.getAttribute("aria-controls") === id; s.setAttribute("aria-selected", on); $(s.getAttribute("aria-controls")).hidden = !on; });
  $("dock").hidden = id === "bag";
  if (id === "say") startSay();
  try { localStorage.setItem("bag-tab", id); } catch (e) {}
  window.scrollTo({ top: 0 });
}
steps.forEach(s => s.addEventListener("click", () => show(s.getAttribute("aria-controls"))));
document.querySelectorAll(".play").forEach(b => b.innerHTML = ICON.speaker);

// ---------- 1. 단어 ----------
const dock = $("dock");
$("dock-bag").innerHTML = BAG_ICON; $("empty-bag").innerHTML = BAG_ICON;
dock.addEventListener("click", () => show("bag"));
dock.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); show("bag"); } });
function overDock(y) { return y >= dock.getBoundingClientRect().top - 20; }

let current = WORDS[0];
function setDialog(w) {
  current = w;
  $("d-q").innerHTML = `Do you have <em>${withArt(w)}</em>?`;
  $("d-a").innerHTML = inBag(w.id) ? `Yes, I do. I have <em>${withArt(w)}</em>.` : `No, I don't. I don't have <em>${withArt(w)}</em>.`;
  [...$("shelf").children].forEach(c => c.classList.toggle("active", c.dataset.id === w.id));
}
document.querySelectorAll("#dialog .play").forEach(b => b.addEventListener("click", () => {
  speak(b.dataset.k === "q" ? S.q(current) : (inBag(current.id) ? S.yes(current) : S.no(current)));
}));

WORDS.forEach(w => {
  const el = document.createElement("div");
  el.className = "item"; el.dataset.id = w.id; el.tabIndex = 0; el.setAttribute("role", "button");
  el.innerHTML = `<button class="add" type="button" aria-label="가방에 넣기">+</button><div class="pic">${PIC[w.id]}</div><div class="en">${w.en}</div><div class="ko">${w.ko}</div>`;
  const tap = () => { setDialog(w); speak(w.en); };
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tap(); } });
  el.querySelector(".add").addEventListener("click", e => { e.stopPropagation(); if (inBag(w.id)) { takeOut(w.id); speak(`I don't have ${withArt(w)}.`); } else add(w); });
  drag(el, w, tap);
  $("shelf").appendChild(el);
});
function add(w) {
  if (putIn(w.id)) { dock.classList.remove("pop"); void dock.offsetWidth; dock.classList.add("pop"); speak(`I have ${withArt(w)}.`); }
  else speak(`I already have ${withArt(w)}.`);
  setDialog(w);
}
function drag(el, w, onTap) {
  let ghost = null, sx = 0, sy = 0, moving = false;
  el.addEventListener("pointerdown", e => {
    if (e.target.closest(".add") || (e.pointerType === "mouse" && e.button !== 0)) return;
    sx = e.clientX; sy = e.clientY; moving = false; el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", e => {
    if (!el.hasPointerCapture(e.pointerId)) return;
    if (!moving && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) {
      moving = true; ghost = document.createElement("div"); ghost.className = "drag-ghost"; ghost.innerHTML = PIC[w.id]; document.body.appendChild(ghost);
    }
    if (moving) { ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px"; dock.classList.toggle("over", overDock(e.clientY)); }
  });
  const end = e => {
    if (!el.hasPointerCapture(e.pointerId)) return;
    el.releasePointerCapture(e.pointerId);
    if (moving) { if (overDock(e.clientY)) add(w); } else onTap();
    if (ghost) ghost.remove(); ghost = null; moving = false; dock.classList.remove("over");
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", () => { if (ghost) ghost.remove(); ghost = null; moving = false; dock.classList.remove("over"); });
}
onBag(() => {
  [...$("shelf").children].forEach(c => { const on = inBag(c.dataset.id); c.classList.toggle("inbag", on); c.querySelector(".add").textContent = on ? "✓" : "+"; });
  $("dock-n").textContent = bag.length;
  const show6 = bag.slice(0, 6);
  $("dock-items").innerHTML = show6.map(id => `<span>${PIC[id]}</span>`).join("") + (bag.length > 6 ? `<span class="more">+${bag.length - 6}</span>` : "");
  setDialog(current);
});

// ---------- 2. 말하기: 한 번에 한 문장 ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
$("sr-warn").hidden = !!SR;
$("s-listen").innerHTML = ICON.speaker; $("s-mic").innerHTML = ICON.mic; $("s-mic").disabled = !SR;
$("say-go").addEventListener("click", () => show("learn"));
let plan = [], pos = 0, results = {};
function buildPlan() {
  plan = [];
  bag.forEach(id => { plan.push({ w: byId[id], k: "q" }); plan.push({ w: byId[id], k: "yes" }); });
  // 가방에 없는 물건 하나로 No 대답도 연습해요
  const out = WORDS.filter(w => !inBag(w.id));
  if (out.length && bag.length) { const w = out[Math.floor(Math.random() * out.length)]; plan.push({ w, k: "q" }); plan.push({ w, k: "no" }); }
}
function startSay() {
  const empty = bag.length === 0;
  $("say-empty").hidden = !empty; $("say-body").hidden = empty;
  if (empty) return;
  const key = bag.join(",");
  if (startSay.key !== key) { startSay.key = key; buildPlan(); pos = 0; results = {}; }
  renderStep();
}
function renderStep() {
  const st = plan[pos], text = S[st.k](st.w);
  $("progress").innerHTML = plan.map((_, i) => `<i class="${i === pos ? "on" : results[i] >= 80 ? "done" : ""}"></i>`).join("");
  $("s-pic").innerHTML = PIC[st.w.id];
  const has = inBag(st.w.id);
  $("s-tag").textContent = has ? "가방에 있어요" : "가방에 없어요"; $("s-tag").className = "tag " + (has ? "ok" : "no");
  $("s-who").textContent = st.k === "q" ? "친구가 물어봐요" : "내가 대답해요";
  $("s-text").innerHTML = text.split(" ").map(t => `<span class="w">${t}</span>`).join(" ");
  $("s-result").innerHTML = "";
  $("s-prev").disabled = pos === 0;
  $("s-next").textContent = pos === plan.length - 1 ? "처음부터" : "다음 →";
  speak(text);
}
$("s-listen").addEventListener("click", () => speak(S[plan[pos].k](plan[pos].w)));
$("s-prev").addEventListener("click", () => { if (pos > 0) { pos--; renderStep(); } });
$("s-next").addEventListener("click", () => { pos = (pos + 1) % plan.length; renderStep(); });

// 표시 단어 하나 = 비교 단어 하나가 되도록, 들린 "do not" 은 "don't" 로 모아요
const norm = s => s.toLowerCase().replace(/’/g, "'").replace(/\bdo not\b/g, "don't").replace(/\bi am\b/g, "i'm").replace(/[^a-z0-9 ]/g, "").split(/\s+/).filter(Boolean);
function align(t, h) {
  const n = t.length, m = h.length;
  const d = Array.from({ length: n + 1 }, (_, i) => Array.from({ length: m + 1 }, (_, j) => i === 0 ? j : j === 0 ? i : 0));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (t[i-1] === h[j-1] ? 0 : 1));
  const hit = Array(n).fill(false); let i = n, j = m;
  while (i > 0 && j > 0) {
    if (t[i-1] === h[j-1] && d[i][j] === d[i-1][j-1]) { hit[i-1] = true; i--; j--; }
    else if (d[i][j] === d[i-1][j-1] + 1) { i--; j--; } else if (d[i][j] === d[i-1][j] + 1) i--; else j--;
  }
  return { acc: Math.max(0, Math.round(100 * (1 - d[n][m] / Math.max(n, m, 1)))), hit };
}
let rec = null;
$("s-mic").addEventListener("click", () => {
  if (!SR) return;
  if (rec) { try { rec.abort(); } catch (e) {} }
  speechSynthesis.cancel();
  const text = S[plan[pos].k](plan[pos].w), mic = $("s-mic"), res = $("s-result");
  rec = new SR(); rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 5;
  mic.classList.add("on"); $("mic-lbl").textContent = "듣고 있어요";
  res.innerHTML = `<div class="heard">문장을 말해 보세요…</div>`;
  rec.onresult = ev => {
    const target = norm(text); let best = { acc: -1, hit: [], said: "" };
    for (const alt of ev.results[0]) { const r = align(target, norm(alt.transcript)); if (r.acc > best.acc) best = { ...r, said: alt.transcript }; }
    const g = best.acc >= 80 ? "good" : best.acc >= 50 ? "mid" : "low";
    $("s-text").querySelectorAll(".w").forEach((el, i) => el.className = "w " + (best.hit[i] ? "hit" : "miss"));
    res.innerHTML = `<div class="pct ${g}">${best.acc}%</div><div class="meter"><i class="${g}" style="width:${best.acc}%"></i></div>
      <div class="heard">들린 말: <b>${best.said}</b><br>${g === "good" ? "Excellent!" : g === "mid" ? "Good try! 빨간 단어를 다시 들어 보세요." : "다시 한 번. 듣기를 누르고 천천히 말해요."}</div>`;
    results[pos] = Math.max(results[pos] || 0, best.acc);
    $("progress").children[pos].className = best.acc >= 80 ? "done" : "on";
    if (g === "good") speak("Excellent!");
  };
  rec.onerror = ev => {
    res.innerHTML = `<div class="heard">${{ "not-allowed": "마이크 사용을 허용해 주세요.", "no-speech": "소리가 안 들렸어요. 다시 눌러서 말해 보세요.", "audio-capture": "마이크를 찾을 수 없어요.", "network": "인터넷 연결을 확인해 주세요." }[ev.error] || "다시 한 번 해 보세요."}</div>`;
  };
  rec.onend = () => { mic.classList.remove("on"); $("mic-lbl").textContent = "따라 말하기"; rec = null; };
  try { rec.start(); } catch (e) { res.innerHTML = `<div class="heard">다시 한 번 눌러 보세요.</div>`; }
});

// ---------- 3. 내 가방 ----------
$("backpack").innerHTML = BAG_SVG + `<div class="inside" id="inside"></div>`;
$("face").innerHTML = FACE;
function haveSentence() {
  const p = bag.map(id => withArt(byId[id]));
  if (!p.length) return "My bag is empty.";
  if (p.length === 1) return `I have ${p[0]}.`;
  return `I have ${p.slice(0, -1).join(", ")} and ${p.at(-1)}.`;
}
function renderBag() {
  const inside = $("inside"); inside.innerHTML = "";
  if (!bag.length) inside.innerHTML = `<span class="none">비어 있어요</span>`;
  bag.forEach(id => {
    const b = document.createElement("button"); b.innerHTML = PIC[id]; b.title = byId[id].en + " 꺼내기"; b.setAttribute("aria-label", byId[id].en + " 꺼내기");
    b.addEventListener("click", () => { takeOut(id); speak(`I don't have ${withArt(byId[id])}.`); });
    inside.appendChild(b);
  });
  $("have-s").innerHTML = `${haveSentence()}<small>${bag.length ? "물건을 누르면 꺼내요" : "1번에서 물건을 넣어 보세요"}</small>`;
}
$("have-play").addEventListener("click", () => speak(haveSentence()));
$("bag-reset").addEventListener("click", () => { bag.length = 0; changed(); speak("My bag is empty."); });
onBag(renderBag);

let askW = WORDS[0], answered = false;
function nextAsk(sayIt = true) {
  const ins = WORDS.filter(w => inBag(w.id)), outs = WORDS.filter(w => !inBag(w.id));
  const pool = ins.length && Math.random() < 0.5 ? ins : outs.length ? outs : ins;
  askW = pool[Math.floor(Math.random() * pool.length)]; answered = false;
  $("ask-t").textContent = S.q(askW); $("ask-fb").textContent = ""; $("ask-fb").className = "fb";
  if (sayIt) speak(S.q(askW));
}
function answer(yes) {
  if (answered) return;
  const truth = inBag(askW.id);
  if (yes === truth) { answered = true; const s = yes ? S.yes(askW) : S.no(askW); $("ask-fb").textContent = s; $("ask-fb").className = "fb ok"; speak(s); }
  else { $("ask-fb").textContent = truth ? `가방을 다시 봐요. ${askW.ko}이(가) 있어요.` : `가방을 다시 봐요. ${askW.ko}이(가) 없어요.`; $("ask-fb").className = "fb bad"; speak("Look in your bag."); }
}
$("ans-yes").addEventListener("click", () => answer(true));
$("ans-no").addEventListener("click", () => answer(false));
$("ask-next").addEventListener("click", () => nextAsk());
$("ask-play").addEventListener("click", () => speak(S.q(askW)));

// ---------- 시작 ----------
watchers.forEach(fn => fn());
nextAsk(false);
let first = "learn";
try { const t = localStorage.getItem("bag-tab"); if (["learn", "say", "bag"].includes(t)) first = t; } catch (e) {}
show(first);
</script>
</body>
</html>
